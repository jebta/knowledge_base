[project]
name = "knowledge-base"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymongo>=4.18.0",
    "python-dotenv>=1.2.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "modelscope>=1.40.0",
    "pymilvus[model]>=3.0.1",
    "openai-agents>=0.22.3",
    "mcp<2.0.0",
    "dashscope>=1.27.6",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
knowledge-base = "knowledge_base:main"

#[build-system]
#requires = ["uv_build>=0.12.10,<0.13.0"]
#build-backend = "uv_build"

[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
