<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件导入服务</title>
    <style>
        :root {
            --bg: #0b0e15;
            --surface: #11151f;
            --surface-2: #171c28;
            --surface-3: #1e2534;
            --text: #e8ecf4;
            --muted: #8b98ab;
            --faint: #6b7689;
            --accent: #4f7cff;
            --accent-hover: #3f6bf0;
            --accent-soft: rgba(79, 124, 255, 0.14);
            --border: #222a3a;
            --border-soft: #1b2130;
            --ok: #10b981;
            --warn: #d97706;
            --err: #ef4444;
            --shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.75);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, "PingFang SC", Arial, sans-serif;
            margin: 0;
            padding: 28px 20px 48px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background:
                radial-gradient(880px 480px at 8% -14%, rgba(79, 124, 255, 0.14), transparent 62%),
                radial-gradient(720px 440px at 96% 110%, rgba(99, 102, 241, 0.10), transparent 64%),
                var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .container {
            width: 100%;
            max-width: 760px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0) 180px), var(--surface);
            padding: 26px 26px 28px;
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            color: var(--text);
        }

        /* ---------- 页头 ---------- */
        .page-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .head-logo {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(145deg, #5a86ff, #4f46e5);
            box-shadow: 0 6px 16px -6px rgba(79, 124, 255, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex: 0 0 auto;
        }

        .head-text {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
            min-width: 0;
        }

        h1 {
            color: #f4f7fc;
            margin: 0;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .head-sub {
            margin-top: 3px;
            font-size: 12px;
            color: var(--faint);
        }

        /* ---------- 上传区 ---------- */
        .upload-area {
            position: relative;
            border: 1.5px dashed #2d3748;
            background: var(--surface-2);
            border-radius: 14px;
            padding: 34px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: var(--accent);
            background: #1a2130;
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .upload-icon {
            width: 46px;
            height: 46px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: var(--accent-soft);
            border: 1px solid rgba(79, 124, 255, 0.24);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a8c2ff;
        }

        .upload-title {
            font-size: 14.5px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 5px;
        }

        .upload-text {
            color: var(--faint);
            font-size: 12.5px;
        }

        .upload-tags {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 12px;
        }

        .upload-tags span {
            font-size: 11px;
            color: var(--muted);
            padding: 3px 9px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface-3);
        }

        .file-input {
            display: none;
        }

        /* ---------- 文件列表 ---------- */
        .file-list {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-item {
            background: var(--surface-2);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            padding: 15px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            transition: border-color .2s ease, background .2s ease;
        }

        .file-item:hover {
            border-color: var(--border);
            background: #191f2c;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 11px;
        }

        .file-name {
            font-weight: 500;
            color: #eef2f8;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            font-size: 11.5px;
            color: var(--faint);
            flex: 0 0 auto;
            font-variant-numeric: tabular-nums;
        }

        /* ---------- 状态徽标 ---------- */
        .status-badge {
            padding: 4px 11px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 600;
            min-width: 72px;
            text-align: center;
            flex: 0 0 auto;
            border: 1px solid transparent;
            line-height: 1.5;
        }

        .status-uploading {
            background: rgba(217, 119, 6, 0.14);
            border-color: rgba(217, 119, 6, 0.3);
            color: #fbbf77;
        }

        .status-processing {
            background: rgba(79, 124, 255, 0.14);
            border-color: rgba(79, 124, 255, 0.3);
            color: #a8c2ff;
        }

        .status-completed {
            background: rgba(16, 185, 129, 0.14);
            border-color: rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.14);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        /* ---------- 进度条 ---------- */
        .progress-wrapper {
            margin-top: 2px;
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background-color: var(--bg);
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid var(--border-soft);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: var(--accent);
            transition: width .4s ease, background-color .3s ease;
        }

        .progress-text {
            font-size: 11.5px;
            color: var(--faint);
            margin-top: 7px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* ---------- 运行日志 ---------- */
        .log-details {
            margin-top: 13px;
            font-size: 13px;
            color: #c3ccda;
            background: rgba(255, 255, 255, 0.022);
            border-radius: 11px;
            padding: 10px 13px;
            border: 1px solid var(--border-soft);
        }

        .log-details summary {
            cursor: pointer;
            user-select: none;
            color: var(--muted);
            font-weight: 500;
            font-size: 12.5px;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color .16s ease;
        }

        .log-details summary::-webkit-details-marker {
            display: none;
        }

        .log-details summary::before {
            content: "";
            width: 5px;
            height: 5px;
            border-right: 1.5px solid var(--muted);
            border-bottom: 1.5px solid var(--muted);
            transform: rotate(-45deg);
            transition: transform .18s ease;
            flex: 0 0 auto;
            margin-top: -2px;
        }

        .log-details[open] summary::before {
            transform: rotate(45deg);
            margin-top: 1px;
        }

        .log-details summary:hover {
            color: var(--text);
        }

        .log-list {
            margin: 10px 0 0;
            padding: 9px 0 0;
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            border-top: 1px solid var(--border-soft);
        }

        .log-list::-webkit-scrollbar {
            width: 7px;
        }

        .log-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .log-list::-webkit-scrollbar-thumb {
            background: #2a3243;
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        .log-list::-webkit-scrollbar-thumb:hover {
            background: #38425a;
            background-clip: content-box;
        }

        .log-list li {
            padding: 5px 0 5px 15px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            font-size: 12.5px;
            color: var(--muted);
        }

        /* 时间线节点圆点 */
        .log-list li::before {
            content: "";
            position: absolute;
            left: 1px;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #3f4b60;
        }

        .log-list li.log-done {
            color: #a7e8c8;
        }

        .log-list li.log-done::before {
            background: var(--ok);
        }

        .log-list li.log-running {
            color: #93c5fd;
        }

        .log-list li.log-running::before {
            background: var(--accent);
            box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.16);
        }

        .log-duration {
            margin-left: auto;
            font-size: 11px;
            color: var(--muted);
            background: var(--surface-3);
            border: 1px solid var(--border-soft);
            padding: 1px 9px;
            border-radius: 999px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        /* ---------- 空状态 ---------- */
        .empty-hint {
            text-align: center;
            color: #5c6678;
            font-size: 12.5px;
            padding: 18px 0 4px;
        }

        @media (max-width: 620px) {
            body {
                padding: 14px 12px 32px;
            }

            .container {
                padding: 20px 16px 22px;
                border-radius: 14px;
            }

            .file-item {
                flex-direction: column-reverse;
                align-items: stretch;
                gap: 10px;
            }

            .status-badge {
                align-self: flex-start;
            }

            .head-sub {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="page-head">
        <div class="head-logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                 aria-hidden="true">
                <path d="M13.2 3.4a1 1 0 0 1 1.7.7V8h4.2a1 1 0 0 1 .72 1.68l-6.9 7.4a1 1 0 0 1-1.45 0l-6.9-7.4A1 1 0 0 1 5.3 8h4.2V4.1a1 1 0 0 1 1.7-.7l1 1.02 1-1.02Z"
                      fill="currentColor" fill-opacity=".18"/>
                <path d="M14 3v5h5.1a1 1 0 0 1 .72 1.68l-6.9 7.4a1 1 0 0 1-1.45 0l-6.9-7.4A1 1 0 0 1 5.3 9H10V3"
                      stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 20.2h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="head-text">
            <h1>知识库文件导入</h1>
            <div class="head-sub">上传文档后自动执行解析与入库流程，可实时查看处理进度</div>
        </div>
    </div>

    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                 aria-hidden="true">
                <path d="M12 15.5V5m0 0L8 9M12 5l4 4" stroke="currentColor" stroke-width="1.7"
                      stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4.6 15.2A3.4 3.4 0 0 0 8 18.6h8a3.4 3.4 0 0 0 3.4-3.4c0-1.66-1.19-3.04-2.77-3.34A4.55 4.55 0 0 0 12 8.4a4.55 4.55 0 0 0-4.63 3.46A3.41 3.41 0 0 0 4.6 15.2Z"
                      stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
                      stroke-opacity=".5"/>
            </svg>
        </div>
        <div class="upload-title">点击选择或拖拽文件到此处</div>
        <div class="upload-text">支持一次选择多个文件，上传后自动开始处理</div>
        <div class="upload-tags">
            <span>PDF</span>
            <span>Markdown</span>
        </div>
        <input type="file" id="fileInput" class="file-input" accept=".pdf,.md">
    </div>

    <div id="fileList" class="file-list">
    </div>

    <div class="empty-hint" id="emptyHint">暂无导入任务</div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const emptyHint = document.getElementById('emptyHint');

    // 模拟后端API地址
    const API_BASE = 'http://127.0.0.1:8000';

    // 拖拽高亮色值需与 CSS 变量保持一致（内联 style 无法直接读变量）
    const DRAG_BORDER = '#4f7cff';
    const DRAG_BG = '#1a2130';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = DRAG_BORDER;
        dropZone.style.background = DRAG_BG;
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '';
        dropZone.style.background = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '';
        dropZone.style.background = '';
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function refreshEmptyHint() {
        emptyHint.style.display = fileList.children.length === 0 ? '' : 'none';
    }

    function updateProgressUI(wrapper, percentage) {
        const bar = wrapper.querySelector('.progress-bar');
        const text = wrapper.querySelector('.progress-text');

        const safePercentage = Math.min(Math.max(percentage, 0), 100);

        bar.style.width = safePercentage + '%';
        text.textContent = Math.round(safePercentage) + '%';

        if (safePercentage >= 100) {
            bar.style.background = '#10b981';
        } else if (safePercentage < 10) {
            bar.style.background = '#d97706';
        } else {
            bar.style.background = '#4f7cff';
        }
    }

    async function uploadFile(file) {
        // === 核心逻辑优化：动态判断总节点数 ===
        const isPDF = file.name.toLowerCase().endsWith('.pdf');
        // PDF 需要 9 步（含上传），MD 跳过 pdf_to_md 需要 8 步
        const totalNodes = isPDF ? 8 : 7;

        const id = 'file-' + Math.random().toString(36).substr(2, 8);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <div class="file-header">
                        <span class="file-name">${file.name}</span>
                        <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    </div>
                    <div class="progress-wrapper">
                        <div class="progress-bar-container">
                            <div class="progress-bar"></div>
                        </div>
                        <div class="progress-text">0%</div>
                    </div>
                    <details class="log-details" open>
                        <summary>准备上传...</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中...</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);
        refreshEmptyHint();

        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logListEl = itemEl.querySelector('.log-list');

        const formData = new FormData();
        formData.append('file', file);

        try {
            progressWrapper.style.display = 'block';

            // 使用动态的 totalNodes 计算基础上传进度
            const uploadPercentage = (1 / totalNodes) * 100;
            updateProgressUI(progressWrapper, Math.min(uploadPercentage, 10));

            const initialLog = document.createElement('li');
            initialLog.textContent = "开始上传文件...";
            initialLog.className = "log-running";
            logListEl.appendChild(initialLog);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');

            const result = await response.json();
            console.log(result)
            const taskId = result.task_id;

            updateProgressUI(progressWrapper, uploadPercentage);
            statusBadge.textContent = '处理中';
            statusBadge.className = 'status-badge status-processing';

            // 把专属的 totalNodes 传给轮询函数
            pollStatus(taskId, itemEl, totalNodes);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '上传失败';
            statusBadge.className = 'status-badge status-error';
            updateProgressUI(progressWrapper, 0);

            const errLog = document.createElement('li');
            errLog.textContent = "❌ 网络请求失败或服务器异常";
            errLog.style.color = "#fca5a5";
            logListEl.appendChild(errLog);
        }
    }

    function normalizeLogText(text) {
        if (typeof text !== 'string') return String(text);
        return text;
    }

    // 接收 totalNodes 参数计算最终百分比和渲染文案
    function formatDuration(seconds) {
        if (seconds < 60) {
            return seconds.toFixed(1) + 's';
        }
        const mins = Math.floor(seconds / 60);
        const secs = (seconds % 60).toFixed(0);
        return `${mins}m${secs}s`;
    }

    function renderLogsAndCalculateProgress(itemEl, doneList, runningList, totalNodes, durations) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const durationMap = durations || {};

        // === 进度计算逻辑 ===
        let currentPercentage = (done.length / totalNodes) * 100;

        if (running.length > 0) {
            currentPercentage += (0.5 / totalNodes) * 100;
        }

        if (currentPercentage >= 100) {
            currentPercentage = 95;
        }

        // 计算总耗时
        let totalDuration = 0;
        for (const key in durationMap) {
            totalDuration += durationMap[key];
        }
        const totalDurationText = totalDuration > 0 ? ` | 总耗时: ${formatDuration(totalDuration)}` : '';

        // 更新日志文案
        logSummary.textContent = `📋 运行日志 (已完成: ${done.length}, 进行中: ${running.length}, 共 ${totalNodes} 步${totalDurationText})`;

        logListEl.innerHTML = '';

        for (const item of done) {
            if (item === 'upload_file') continue;

            const li = document.createElement('li');
            const nameSpan = document.createElement('span');
            nameSpan.textContent = `${normalizeLogText(item)} 节点执行完成`;
            li.appendChild(nameSpan);

            // 添加耗时标签
            if (durationMap[item] !== undefined) {
                const durationSpan = document.createElement('span');
                durationSpan.className = 'log-duration';
                durationSpan.textContent = formatDuration(durationMap[item]);
                li.appendChild(durationSpan);
            }

            li.className = 'log-done';
            logListEl.appendChild(li);
        }

        for (const item of running) {
            const li = document.createElement('li');
            li.textContent = `正在处理 ${normalizeLogText(item)} 节点...`;
            li.className = 'log-running';
            logListEl.appendChild(li);
        }

        logListEl.scrollTop = logListEl.scrollHeight;

        return currentPercentage;
    }

    function pollStatus(taskId, itemEl, totalNodes) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressWrapper = itemEl.querySelector('.progress-wrapper');
        const logDetails = itemEl.querySelector('.log-details');
        let stopped = false;

        const interval = setInterval(async () => {
            if (stopped) return;

            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                if (!res.ok) throw new Error('Status request failed');

                const data = await res.json();

                if (stopped) return;

                // 传入 totalNodes 继续计算
                const calculatedPercentage = renderLogsAndCalculateProgress(itemEl, data.done_list, data.running_list, totalNodes, data.durations);

                if (data.status === 'completed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressUI(progressWrapper, 100);

                    setTimeout(() => {
                        logDetails.open = false;
                    }, 1000);

                } else if (data.status === 'failed') {
                    stopped = true;
                    clearInterval(interval);
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';

                    const logListEl = itemEl.querySelector('.log-list');
                    const errLog = document.createElement('li');
                    errLog.textContent = "❌ 工作流执行失败中止";
                    errLog.style.color = "#fca5a5";
                    logListEl.appendChild(errLog);

                } else if (data.status === 'processing') {
                    updateProgressUI(progressWrapper, calculatedPercentage);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 1500);
    }

    refreshEmptyHint();
</script>

</body>
</html>
