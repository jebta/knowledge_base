<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>掌柜智库</title>
    <style>
        :root {
            --bg: #0b0e15;
            --surface: #11151f;
            --surface-2: #171c28;
            --surface-3: #1e2534;
            --text: #e8ecf4;
            --muted: #8b98ab;
            --faint: #6b7689;
            --accent: #4f7cff;
            --accent-hover: #3f6bf0;
            --accent-soft: rgba(79, 124, 255, 0.14);
            --accent-ring: rgba(79, 124, 255, 0.28);
            --border: #222a3a;
            --border-soft: #1b2130;
            --ok: #34d399;
            --radius: 14px;
            --shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.75);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, "PingFang SC", Arial, sans-serif;
            background:
                radial-gradient(880px 480px at 10% -12%, rgba(79, 124, 255, 0.14), transparent 62%),
                radial-gradient(720px 440px at 94% 112%, rgba(99, 102, 241, 0.10), transparent 64%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .app {
            width: 100%;
            max-width: 900px;
            height: min(780px, calc(100vh - 40px));
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0) 180px), var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ---------- 顶栏 ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 18px;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(255, 255, 255, 0.015);
            flex: 0 0 auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
        }

        .logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(145deg, #5a86ff, #4f46e5);
            box-shadow: 0 4px 14px -4px rgba(79, 124, 255, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex: 0 0 auto;
        }

        .title {
            display: flex;
            flex-direction: column;
            line-height: 1.25;
            min-width: 0;
        }

        .title strong {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .title span {
            font-size: 11.5px;
            color: var(--faint);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 0 0 auto;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: var(--muted);
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface-2);
            white-space: nowrap;
        }

        .pill::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #556072;
            flex: 0 0 auto;
        }

        .pill.is-online {
            color: #b9e7d3;
            border-color: rgba(52, 211, 153, 0.24);
        }

        .pill.is-online::before {
            background: var(--ok);
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.16);
        }

        .btn {
            border: 1px solid transparent;
            background: var(--accent);
            color: #fff;
            padding: 7px 13px;
            border-radius: 9px;
            font-size: 12.5px;
            font-family: inherit;
            cursor: pointer;
            transition: background .16s ease, border-color .16s ease, color .16s ease, transform .12s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .btn-ghost {
            background: transparent;
            border-color: var(--border);
            color: var(--muted);
        }

        .btn-ghost:hover {
            background: var(--surface-3);
            border-color: #2d3648;
            color: var(--text);
        }

        /* ---------- 对话区 ---------- */
        .chat {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 18px 10px;
            scroll-behavior: smooth;
        }

        .chat::-webkit-scrollbar {
            width: 9px;
        }

        .chat::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat::-webkit-scrollbar-thumb {
            background: #2a3243;
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        .chat::-webkit-scrollbar-thumb:hover {
            background: #38425a;
            background-clip: content-box;
        }

        .dayline {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--faint);
            font-size: 11.5px;
            margin: 2px 0 16px;
        }

        .dayline::before,
        .dayline::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-soft);
        }

        .msg {
            display: flex;
            gap: 10px;
            margin: 14px 0;
            align-items: flex-end;
        }

        .msg.user {
            justify-content: flex-end;
        }

        /* 关键：只让“消息内容容器”(排除头像)在 flex 中可伸缩，避免被压到“1 个字宽”导致竖排换行 */
        .msg > div:not(.avatar) {
            flex: 1;
            min-width: 0;
        }

        .msg.user > div:not(.avatar) {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: var(--surface-3);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            flex: 0 0 auto;
        }

        .avatar.bot {
            background: var(--accent-soft);
            border-color: rgba(79, 124, 255, 0.26);
            color: #a8c2ff;
        }

        .avatar svg {
            display: block;
        }

        .bubble {
            max-width: min(720px, 78%);
            display: inline-block;
            border-radius: 14px;
            border-bottom-left-radius: 5px;
            padding: 11px 14px;
            border: 1px solid var(--border-soft);
            background: var(--surface-2);
            line-height: 1.65;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            color: var(--text);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
        }

        .msg.user .bubble {
            background: linear-gradient(160deg, #5a86ff, #4f6df0);
            color: #fff;
            border-color: transparent;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 5px;
            box-shadow: 0 6px 18px -10px rgba(79, 124, 255, 0.9);
        }

        .meta {
            font-size: 11px;
            color: var(--faint);
            margin-top: 6px;
            padding: 0 2px;
        }

        .msg.user .meta {
            color: var(--faint);
        }

        /* ---------- 阶段进度 ---------- */
        details.progress {
            margin: -2px 0 10px;
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            padding: 8px 11px;
            background: rgba(255, 255, 255, 0.022);
        }

        details.progress summary {
            cursor: pointer;
            user-select: none;
            color: var(--muted);
            font-size: 12px;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        details.progress summary::-webkit-details-marker {
            display: none;
        }

        details.progress summary::before {
            content: "";
            width: 5px;
            height: 5px;
            border-right: 1.5px solid var(--muted);
            border-bottom: 1.5px solid var(--muted);
            transform: rotate(-45deg);
            transition: transform .18s ease;
            flex: 0 0 auto;
            margin-top: -2px;
        }

        details.progress[open] summary::before {
            transform: rotate(45deg);
            margin-top: 1px;
        }

        details.progress summary:hover {
            color: var(--text);
        }

        .progress ul {
            margin: 9px 0 0;
            padding: 8px 0 0;
            list-style: none;
            border-top: 1px solid var(--border-soft);
        }

        .progress li {
            margin: 0;
            padding: 4px 0;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }

        /* ---------- 答案图片 ---------- */
        .answer-text {
            white-space: pre-wrap;
        }

        .answer-images {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-top: 12px;
            border-top: 1px solid var(--border-soft);
        }

        .answer-images img {
            display: block;
            max-width: min(100%, 600px);
            max-height: 600px;
            width: auto;
            height: auto;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface-3);
            margin-bottom: 4px;
        }

        .answer-images a {
            font-size: 11.5px;
            color: var(--faint);
            text-decoration: none;
            word-break: break-all;
            transition: color .16s ease;
        }

        .answer-images a:hover {
            color: #a8c2ff;
            text-decoration: underline;
        }

        /* ---------- 打字动画 ---------- */
        .typing {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            padding: 4px 0;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #7d9cff;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: .15s;
        }

        .dot:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: .35;
            }
            40% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* ---------- 输入区 ---------- */
        .composer-wrap {
            flex: 0 0 auto;
            border-top: 1px solid var(--border-soft);
            background: rgba(255, 255, 255, 0.015);
        }

        .composer {
            padding: 12px 16px 8px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 44px;
            max-height: 140px;
            padding: 11px 13px;
            border-radius: 11px;
            border: 1px solid var(--border);
            outline: none;
            font-size: 14px;
            line-height: 1.5;
            font-family: inherit;
            background: var(--surface-2);
            color: var(--text);
            transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
        }

        textarea:hover {
            border-color: #2c3547;
        }

        textarea:focus {
            border-color: var(--accent);
            background: #1a2130;
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        textarea::placeholder {
            color: var(--faint);
        }

        .send {
            height: 44px;
            padding: 0 16px;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            font-family: inherit;
            color: #fff;
            background: linear-gradient(160deg, #5a86ff, #4f6df0);
            box-shadow: 0 6px 16px -8px rgba(79, 124, 255, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.18);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 0 0 auto;
            transition: filter .16s ease, transform .12s ease, opacity .16s ease;
        }

        .send:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        .send:active:not(:disabled) {
            transform: translateY(1px);
        }

        .send:disabled {
            opacity: .5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .hint {
            padding: 0 18px 11px;
            color: var(--faint);
            font-size: 11.5px;
            background: transparent;
        }

        .kbd {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            border: 1px solid var(--border);
            padding: 1px 5px;
            border-radius: 5px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 11px;
        }

        @media (max-width: 680px) {
            body {
                padding: 0;
            }

            .app {
                height: 100vh;
                max-width: none;
                border-radius: 0;
                border: none;
            }

            .title span {
                display: none;
            }

            .bubble {
                max-width: 86%;
            }

            .pill {
                display: none;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <div class="brand">
            <div class="logo">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                     aria-hidden="true">
                    <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H12l-4.2 3.15A.6.6 0 0 1 6.8 18.7V16H6.5A2.5 2.5 0 0 1 4 13.5v-7Z"
                          fill="currentColor" fill-opacity=".95"/>
                    <circle cx="9.4" cy="10" r="1.15" fill="#3b57d6"/>
                    <circle cx="14.6" cy="10" r="1.15" fill="#3b57d6"/>
                </svg>
            </div>
            <div class="title">
                <strong>掌柜智库</strong>
                <span id="subTitle">在线 · 可查询知识库与联网信息</span>
            </div>
        </div>
        <div class="top-actions">
            <span class="pill" id="apiPill">API: 未连接</span>
            <button class="btn btn-ghost" id="btnClear">清空对话</button>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="dayline">今天</div>
        <div class="msg bot">
            <div class="avatar bot">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                     aria-hidden="true">
                    <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H12l-4.2 3.15A.6.6 0 0 1 6.8 18.7V16H6.5A2.5 2.5 0 0 1 4 13.5v-7Z"
                          fill="currentColor"/>
                </svg>
            </div>
            <div>
                <div class="bubble">你好，我是掌柜智库客服。你可以直接提问，我会在“阶段进度”里展示处理过程。</div>
                <div class="meta">提示：可以问“成都有什么好吃的？”</div>
            </div>
        </div>
    </div>

    <div class="composer-wrap">
        <div class="composer">
            <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
            <button class="send" id="send">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                     aria-hidden="true">
                    <path d="M4.2 11.3 19 4.6a.6.6 0 0 1 .8.8l-6.7 14.8a.6.6 0 0 1-1.1-.05l-2.2-6.1-6.1-2.2a.6.6 0 0 1-.05-1.1Z"
                          fill="currentColor"/>
                </svg>
                发送
            </button>
        </div>
        <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span
                class="kbd">Enter</span> 换行
        </div>
    </div>
</div>

<script>

    // 默认同源；如你把页面单独打开（file://），可改成 http://127.0.0.1:8001
    // const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001';
    const API_BASE = 'http://127.0.0.1:8001'
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const apiPill = document.getElementById('apiPill');

    // 机器人头像图标（纯装饰，替代原 emoji）
    const BOT_AVATAR_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H12l-4.2 3.15A.6.6 0 0 1 6.8 18.7V16H6.5A2.5 2.5 0 0 1 4 13.5v-7Z" fill="currentColor"/></svg>';

    // 创建会话: 从localStorage获取sessionId
    // debugger
    let sessionId = localStorage.getItem('kb_session_id');
    // 不存在则创建
    if (!sessionId) {
        sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        //存入localStorage
        localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom() {
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    function nowTime() {
        const d = new Date();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function formatTime(ts) {
        if (!ts) return nowTime();
        const d = new Date(Number(ts) * 1000);
        if (Number.isNaN(d.getTime())) return nowTime();
        return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", "&#039;");
    }

    function isImageUrl(url) {
        // 增加宽松度，有些 url 可能后面跟了奇怪的参数
        // 只要包含 .jpg .png 等扩展名，且后面是 ? # 或 结束，或者被某些标点截断前
        // 简单判断：路径部分以图片后缀结尾
        try {
            const u = new URL(url);
            return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
        } catch (e) {
            // 如果 new URL 失败（比如相对路径或非法字符），退回正则匹配
            return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
        }
    }

    function normalizeUrl(rawUrl) {
        const s = String(rawUrl || '').trim();
        if (!s) return '';
        // 尽量保留原始 URL，但把空格编码，避免 img src 失败
        return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr) {
        const seen = new Set();
        const out = [];
        for (const x of (Array.isArray(arr) ? arr : [])) {
            const v = String(x || '');
            if (!v) continue;
            if (seen.has(v)) continue;
            seen.add(v);
            out.push(v);
        }
        return out;
    }

    function extractUrlsLoose(text) {
        const s = String(text || '');
        // 简单正则提取：匹配 http/https 开头，直到遇到空白字符
        // [^\s] 包含中文、特殊符号等，直到遇到换行或空格
        const regex = /(https?:\/\/[^\s]+)/g;
        const matches = s.match(regex) || [];
        const urls = [];

        // 去除首尾标点
        const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
        const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');

        for (const m of matches) {
            let u = trimHeadPunct(trimTailPunct(m));
            // 简单清洗可能混入的结尾
            if (u) urls.push(u);
        }
        return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw) {
        const s = String(raw || '');
        // 支持多种写法：【图片】、【 图片 】、[图片]、[ 图片 ]
        const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
        let m;
        let lastIdx = -1;
        let lastLen = 0;
        while ((m = re.exec(s)) !== null) {
            lastIdx = m.index;
            lastLen = m[0].length;
        }
        return {idx: lastIdx, len: lastLen};
    }

    function parseAnswerAndImages(text) {
        const raw = String(text || '');
        const {idx, len} = findLastImageMarkerIndex(raw);
        if (idx === -1) return {text: raw, images: []};

        const before = raw.slice(0, idx).trimEnd();
        const after = raw.slice(idx + len).trim();
        const urls = [];

        // 优先按“每行一个 URL”的方式解析，允许 URL 中包含空格
        const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        for (const line of lines) {
            if (line.startsWith('http://') || line.startsWith('https://')) {
                urls.push(line);
            } else {
                // 兼容同一行包含多个 URL 的情况
                const matches = extractUrlsLoose(line);
                for (const u of matches) {
                    urls.push(u);
                }
            }
        }

        // 去重保序 + 过滤图片链接
        const seen = new Set();
        const images = [];
        for (const u of urls) {
            const normalized = normalizeUrl(u);
            if (!isImageUrl(normalized)) continue;
            if (seen.has(normalized)) continue;
            seen.add(normalized);
            images.push(normalized);
        }
        return {text: before, images};
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls) {
        const {text, images: imagesFromBlock} = parseAnswerAndImages(answerText);
        const candidates = Array.isArray(candidateImageUrls)
            ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
            : [];
        const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;

        // 使用宽松提取
        const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);

        // 只要后端给了候选图片，就展示（避免答案没写“如图”但用户仍需要看图）
        // 或者从文本里提取到了图片 URL
        const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);

        // 优先级：Block 显式标记 > 后端候选 > 文本宽松提取
        // 注意：这里做个并集可能更好，防止漏掉
        const allImages = new Set([
            ...(hasBlockImages ? imagesFromBlock : []),
            ...candidates,
            ...looseImages
        ]);
        const images = Array.from(allImages);

        containerEl.textContent = '';

        if ((text || '').trim().length > 0) {
            const textEl = document.createElement('div');
            textEl.className = 'answer-text';
            textEl.textContent = text;
            containerEl.appendChild(textEl);
        } else {
            const textEl = document.createElement('div');
            textEl.className = 'answer-text';
            textEl.textContent = '（已完成，但未返回答案）';
            containerEl.appendChild(textEl);
        }

        if (images && images.length > 0) {
            const imgWrap = document.createElement('div');
            imgWrap.className = 'answer-images';
            for (const url of images) {
                const safeUrl = normalizeUrl(url);
                const img = document.createElement('img');
                img.loading = 'lazy';
                img.src = safeUrl;
                img.alt = '参考图片';
                img.referrerPolicy = 'no-referrer';
                img.addEventListener('error', () => {
                    img.style.display = 'none';
                });
                imgWrap.appendChild(img);

                const link = document.createElement('a');
                link.href = safeUrl;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = url;
                imgWrap.appendChild(link);
            }
            containerEl.appendChild(imgWrap);
        }
    }

    function addUserMsg(text) {
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
    }

    function addUserMsgWithTime(text, ts) {
        const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls) {
        const id = 'bot-his-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">${BOT_AVATAR_SVG}</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        const el = document.getElementById(id);
        if (el) {
            const answerEl = el.querySelector('.answer');
            renderAnswerWithImages(answerEl, text || '', imageUrls || []);
        }
        scrollToBottom();
    }

    function addBotMsgSkeleton() {
        const id = 'bot-' + Math.random().toString(36).slice(2);
        const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">${BOT_AVATAR_SVG}</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <!-- ✅ 流程进度始终在最上方 -->
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
              <!-- ✅ 打字动画放在进度下方、答案上方 -->
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <!-- ✅ 答案容器放在最下方 -->
              <div class="answer"></div>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
        chatEl.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
        return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status) {
        const details = botMsgEl.querySelector('details.progress');
        const summary = details.querySelector('summary');
        const ul = details.querySelector('ul');
        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        const totalDone = done.length;
        const totalRun = running.length;

        const statusMap = {
            'processing': '处理中',
            'completed': '已完成',
            'failed': '失败',
            'pending': '等待中',
        };
        const displayStatus = statusMap[status] || status || 'unknown';

        summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

        const lines = [
            ...done.map(x => `✅ ${x}`),
            ...running.map(x => `⏳ ${x}`)
        ];
        ul.innerHTML = '';
        if (lines.length === 0) {
            ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
        } else {
            for (const line of lines) {
                ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
            }
        }
    }

    async function apiHealth() {
        try {
            const res = await fetch(`${API_BASE}/health`);
            if (!res.ok) throw new Error('health not ok');
            apiPill.classList.add('is-online');
            apiPill.textContent = `API: 已连接`;
        } catch (e) {
            apiPill.classList.remove('is-online');
            apiPill.textContent = `API: 未连接`;
        }
    }

    async function loadHistory() {
        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`);
            if (!res.ok) return;
            const data = await res.json();
            const items = Array.isArray(data.items) ? data.items : [];
            if (items.length === 0) return;
            // 保留首条欢迎消息，其余先清空再渲染历史
            const nodes = Array.from(chatEl.querySelectorAll('.msg'));
            for (let i = 1; i < nodes.length; i++) nodes[i].remove();
            for (const item of items) {
                if (item.role === 'user') {
                    addUserMsgWithTime(item.text || '', item.ts);
                } else {
                    addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
                }
            }
            scrollToBottom();
        } catch (_) {
        }
    }

    async function submitQuery(text) {
        const res = await fetch(`${API_BASE}/query`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                query: text,
                session_id: sessionId
            })
        });
        if (!res.ok) {
            const msg = await res.text();
            throw new Error(msg || '请求失败');
        }
        return await res.json();
    }

    async function onSend() {
        const text = (inputEl.value || '').trim();
        if (!text) return;
        inputEl.value = '';
        addUserMsg(text);
        const botMsgEl = addBotMsgSkeleton();
        sendBtn.disabled = true;

        try {
            const data = await submitQuery(text);

            // 渲染初始状态
            renderProgress(botMsgEl, [], [], 'pending');

            // 流式：SSE
            const {task_id} = data;

            const bubble = botMsgEl.querySelector('.bubble');
            let answerEl = bubble.querySelector('.answer');
            if (!answerEl) {
                answerEl = document.createElement('div');
                answerEl.className = 'answer';
                bubble.appendChild(answerEl); // 追加到 bubble 末尾（即 progress 之后
            }

            const es = new EventSource(`${API_BASE}/stream/${task_id}`);
            let rawAnswerText = '';

            es.addEventListener('progress', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
                    // 当进度状态已完成时，提前结束“...”等待态
                    if (d && d.status === 'completed') {
                        const typing = botMsgEl.querySelector('.typing');
                        if (typing) typing.remove();
                        // 防止后端未发送 final 导致按钮一直禁用
                        sendBtn.disabled = false;
                    }
                } catch (_) {
                }
            });

            es.addEventListener('delta', (e) => {
                try {
                    const d = JSON.parse(e.data || '{}');
                    const delta = d.delta || '';
                    if (delta) {
                        rawAnswerText += delta;
                        // 即使后端未发送 final，也尽可能在流式过程中渲染图片
                        renderAnswerWithImages(answerEl, rawAnswerText, []);
                        scrollToBottom();
                    }
                } catch (_) {
                }
            });

            es.addEventListener('final', (e) => {

                const typing = botMsgEl.querySelector('.typing');
                if (typing) typing.remove();

                // ★ 关键修复：强制把所有"进行中 ⏳"的节点标记为"已完成 ✅"
                // 原因：最后一条 progress 事件可能还没到就被 final 抢先了，
                // 导致"生成答案"等节点永远卡在 ⏳ 状态不变绿
                const details = botMsgEl.querySelector('details.progress');
                if (details) {
                    const ul = details.querySelector('ul');
                    if (ul) {
                        const lis = ul.querySelectorAll('li');
                        lis.forEach(li => {
                            if (li.textContent.includes('⏳')) {
                                li.textContent = li.textContent.replace('⏳', '✅');
                            }
                        });
                    }
                    // 更新 summary：全部完成
                    const summary = details.querySelector('summary');
                    if (summary) {
                        const totalDone = details.querySelectorAll('li').length;
                        summary.textContent = `阶段进度（已完成${totalDone}，进行中0，状态：已完成）`;
                    }
                    // 收起进度条
                    details.removeAttribute('open');
                }

                try {
                    const d = JSON.parse(e.data || '{}');
                    // 优先使用 final 包里的完整 answer，否则回退到流式拼接的文本
                    const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
                    renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
                } catch (_) {
                }
                es.close();
                sendBtn.disabled = false;
            });

            es.addEventListener('error', (e) => {
                const typing = botMsgEl.querySelector('.typing');
                if (typing) typing.remove();
                // 收起进度条
                const progress = botMsgEl.querySelector('details.progress');
                if (progress) progress.removeAttribute('open');

                try {
                    const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
                    rawAnswerText += `\n\n（错误：${msg}）`;
                    renderAnswerWithImages(answerEl, rawAnswerText, []);
                } catch (_) {
                    rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
                    renderAnswerWithImages(answerEl, rawAnswerText, []);
                }
                es.close();
                sendBtn.disabled = false;
            });
        } catch (e) {
            const bubble = botMsgEl.querySelector('.bubble');
            const progress = botMsgEl.querySelector('details.progress');
            const typing = botMsgEl.querySelector('.typing');
            if (typing) typing.remove();
            bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
            sendBtn.disabled = false;
        }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            onSend();
        }
    });
    btnClear.addEventListener('click', async () => {
        if (!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

        try {
            const res = await fetch(`${API_BASE}/history/${sessionId}`, {method: 'DELETE'});
            if (!res.ok) {
                console.error("Failed to clear history backend, status:", res.status);
                alert('服务端清空失败，仅清空本地显示');
            }
        } catch (e) {
            console.error("Failed to clear history backend", e);
            alert('服务端清空失败，仅清空本地显示');
        }

        // 清空除首条欢迎消息外的内容
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for (let i = 1; i < nodes.length; i++) nodes[i].remove();
        scrollToBottom();
    });

    apiHealth();
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
</script>
</body>
